name: CI

# Gates every pull request *before* merge. Previously the only quality checks
# lived in deploy.yml's build job, which runs on push to main — i.e. after a PR
# was already merged, so a broken PR could only be discovered by a failed
# production deploy.
on:
  pull_request:
  # Also run on main so the default branch carries its own commit status.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same ref: a new push to a PR makes the
# previous run's result irrelevant. Deliberately NOT the "pages" group used by
# deploy.yml — CI must never queue behind or interfere with a deployment.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (supply-chain hardening); the trailing
      # comment records the human-readable version. Keep in sync with deploy.yml.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Audit (high and above)
        run: npm audit --omit=dev --audit-level=high

      # Catches export-time failures (bad generateStaticParams, prerender
      # errors) that typecheck and lint cannot see.
      - name: Build static site
        run: npm run build
